    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));
    line.setAttribute('class', cls);
    parent.appendChild(line);
    return line;
  }

  /**
   * すべての通路を「壁（通れない側）」を描くことで表現する。
   * 「つながっていない方向にだけ壁の線を引く」方式。
   */
  _drawCorridors(svg, grid) {
    const group = document.createElementNS(SVG_NS, 'g');
    group.setAttribute('class', 'corridors');
    const drawnWalls = new Set();
    const half = this.cellSize / 2;

    for (const cell of grid.allCells()) {
      for (const dir of Object.keys(MK.DIRS)) {
        if (cell.hasLink(dir)) continue; // 通行可能な方向には壁を描かない

        const other = grid.neighbor(cell, dir);
        const key = other ? this._wallKey(cell, other) : this._borderWallKey(cell, dir);
        if (drawnWalls.has(key)) continue;
        drawnWalls.add(key);

        this._drawWallSegment(group, cell, dir, half);
      }
    }
    svg.appendChild(group);
  }

  /** グリッド内部の壁（隣接マスと共有する壁）の重複描画を防ぐためのキー */
  _wallKey(a, b) {
    const ka = `${a.row},${a.col}`;
    const kb = `${b.row},${b.col}`;
    return ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
  }

  /** グリッド外周の壁（隣接マスが存在しない側）のキー */
  _borderWallKey(cell, dir) {
    return `border:${cell.row},${cell.col},${dir}`;
  }

  /** 六角形セルの6つの角（中心からの相対座標）を返す */
  _hexCorners(cx, cy) {
    const r = this.hexR;
    return HEX_CORNER_ANGLES.map((deg) => {
      const rad = (Math.PI / 180) * deg;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    });
  }

  /** 1マスの、指定した方向の辺（壁）を1本の線として描画する */
  _drawWallSegment(group, cell, dir, half) {
    const { toX, toY } = this.pos;
    const cx = toX(cell.row, cell.col);
    const cy = toY(cell.row, cell.col);

    if (this.shape === 'hex') {
      const corners = this._hexCorners(cx, cy);
      const [ia, ib] = HEX_EDGE_CORNERS[dir] || HEX_EDGE_CORNERS.E;
      const [x1, y1] = corners[ia];
      const [x2, y2] = corners[ib];
      this._line(group, x1, y1, x2, y2, 'road-rail');
      return;
    }

    let x1, y1, x2, y2;

    switch (dir) {
      case 'N':
        x1 = cx - half; y1 = cy - half; x2 = cx + half; y2 = cy - half;
        break;
      case 'S':
        x1 = cx - half; y1 = cy + half; x2 = cx + half; y2 = cy + half;
        break;
      case 'E':
        x1 = cx + half; y1 = cy - half; x2 = cx + half; y2 = cy + half;
        break;
      case 'W':
      default:
        x1 = cx - half; y1 = cy - half; x2 = cx - half; y2 = cy + half;
        break;
    }

    this._line(group, x1, y1, x2, y2, 'road-rail');
  }

  /** スタート・ゴールの丸ラベルを描画する */
  _drawMarker(svg, cell, label, cls) {
    const { toX, toY } = this.pos;
    const x = toX(cell.row, cell.col);
    const y = toY(cell.row, cell.col);
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', cls);

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', x);
    circle.setAttribute('cy', y);
    // 迷路のマスからはみ出してもよいので、しっかり目立つ大きさにする。
    circle.setAttribute('r', this.cellSize * 0.65);
    g.appendChild(circle);

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y + 9);
    text.setAttribute('text-anchor', 'middle');
    text.textContent = label;
    g.appendChild(text);

    svg.appendChild(g);
  }

  /** 誤答枝の行き止まりに、モンスター（デビル）画像＋「いきどまり」を描画する */
  _drawDeadEnd(svg, d) {
    const { toX, toY } = this.pos;
    const x = toX(d.cell.row, d.cell.col);
    const y = toY(d.cell.row, d.cell.col);
    const r = this.cellSize * 0.36;
    const iconCy = y - this.cellSize * 0.12;

    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'dead-end-mark');

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', x.toFixed(2));
    circle.setAttribute('cy', iconCy.toFixed(2));
    circle.setAttribute('r', r.toFixed(2));
    circle.setAttribute('class', 'dead-end-circle');
    g.appendChild(circle);

    // モンスター画像を丸の内側だけに収まるようクリップして描画する。
    // （オリジナル画像は正方形とは限らないため、はみ出しを防ぐ）
    const clipId = `dead-end-clip-${this._clipIdSeq++}`;
    const clipPath = document.createElementNS(SVG_NS, 'clipPath');
    clipPath.setAttribute('id', clipId);
    const clipCircle = document.createElementNS(SVG_NS, 'circle');
    clipCircle.setAttribute('cx', x.toFixed(2));
    clipCircle.setAttribute('cy', iconCy.toFixed(2));
    clipCircle.setAttribute('r', (r - 2).toFixed(2));
    clipPath.appendChild(clipCircle);
    g.appendChild(clipPath);

    const size = r * 1.85;
    const image = document.createElementNS(SVG_NS, 'image');
    image.setAttribute('x', (x - size / 2).toFixed(2));
    image.setAttribute('y', (iconCy - size / 2).toFixed(2));
    image.setAttribute('width', size.toFixed(2));
    image.setAttribute('height', size.toFixed(2));
    image.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    image.setAttributeNS(XLINK_NS, 'xlink:href', this.monsterHref);
    image.setAttribute('href', this.monsterHref);
    image.setAttribute('clip-path', `url(#${clipId})`);
    g.appendChild(image);

    const label = document.createElementNS(SVG_NS, 'text');
    label.setAttribute('x', x.toFixed(2));
    label.setAttribute('y', (y + this.cellSize * 0.46).toFixed(2));
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('class', 'dead-end-text');
    label.textContent = 'いきどまり';
    g.appendChild(label);

    svg.appendChild(g);
  }

  /** 問題ボックス（長文の問題文＋A/B/Cの選択肢一覧）を描画する */
  _drawProblemBox(svg, p, grid) {
    const { toX, toY } = this.pos;
    const x = toX(p.cell.row, p.cell.col);
    const y = toY(p.cell.row, p.cell.col);
    const LETTERS = ['A', 'B', 'C'];

    // 長文問題編は文章が長くなるため、実際の折り返し行数にあわせて
    // 箱の高さを動的に決める（短い問題は小さく、長い問題は大きく）。
    // 選択肢は迷路の出口には文字を置かず、A/B/Cの記号だけにして、
    // 実際の選択肢文はこの問題ボックスの下部にまとめて表示する。
    const boxW = this.cellSize * 5.1;

    // 文字サイズの倍率。大きくするほど1行に入る文字数を減らして折り返し、
    // 行の高さも広げることで、ボックス幅からはみ出さないようにする。
    const fontScale = this.fontScale || 1;
    const qFontSize = 19 * fontScale;
    const optFontSize = 17 * fontScale;

    const qCharsPerLine = Math.max(8, Math.round(22 / fontScale));
    const qLineHeight = 26 * fontScale;
    const qLines = wrapTextLines(p.questionText, qCharsPerLine);

    const optCharsPerLine = Math.max(8, Math.round(25 / fontScale));
    const optLineHeight = 23 * fontScale;
    const optionLineGroups = p.options.map((option, i) => wrapTextLines(LETTERS[i] + '. ' + option.text, optCharsPerLine));
    const optionLineCount = optionLineGroups.reduce((sum, lines) => sum + lines.length, 0);

    const topPad = 22;
    const dividerGap = 18;
    const bottomPad = 18;
    const boxH = Math.max(
      this.cellSize * 2.6,
      topPad + qLines.length * qLineHeight + dividerGap + optionLineCount * optLineHeight + bottomPad
    );

    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'problem-box');

    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', (x - boxW / 2).toFixed(2));
    rect.setAttribute('y', (y - boxH / 2).toFixed(2));
    rect.setAttribute('width', boxW.toFixed(2));
    rect.setAttribute('height', boxH.toFixed(2));
    rect.setAttribute('rx', 14);
    rect.setAttribute('class', 'problem-box-fill');
    g.appendChild(rect);

    // ボックスの枠線は、見た目の範囲に実際に入っているマス目の状態を
    // その場で調べて描く。単に「入口・正解・誤答2つの4方向」だけを
    // 想定すると、正解や誤答のルートがボックスの範囲内で何マスか
    // 続いてから外に出る場合に、その本当の出口位置とズレが生じ、
    // 「壁のはずが実は通れる」「通れるはずが壁でふさがれている」と
    // いった不安定な迷路になってしまうため、実際のマスのつながりから
    // 隙間の位置を決めている。
    const optionDirs = p.options.map((option) => option.dir);
    const exitAnchors = this._drawBoxBorder(g, x, y, boxW, boxH, grid, p.cell, optionDirs);

    const boxTop = y - boxH / 2;

    const qText = document.createElementNS(SVG_NS, 'text');
    qText.setAttribute('text-anchor', 'middle');
    qText.setAttribute('class', 'problem-question');
    qText.style.fontSize = qFontSize.toFixed(2) + 'px';
    const qStartY = boxTop + topPad + qLineHeight * 0.7;
    qLines.forEach((line, i) => {
      const tspan = document.createElementNS(SVG_NS, 'tspan');
      tspan.setAttribute('x', x.toFixed(2));
      tspan.setAttribute('y', (qStartY + i * qLineHeight).toFixed(2));
      tspan.textContent = line;
      qText.appendChild(tspan);
    });
    g.appendChild(qText);

    // 問題文と選択肢一覧の間の区切り線
    const dividerY = boxTop + topPad + qLines.length * qLineHeight + dividerGap / 2;
    this._line(g, x - boxW / 2 + 16, dividerY, x + boxW / 2 - 16, dividerY, 'problem-divider');

    // 選択肢一覧（A. ○○ / B. ○○ / C. ○○）
    const optText = document.createElementNS(SVG_NS, 'text');
    optText.setAttribute('text-anchor', 'middle');
    optText.setAttribute('class', 'problem-options');
    optText.style.fontSize = optFontSize.toFixed(2) + 'px';
    let optY = boxTop + topPad + qLines.length * qLineHeight + dividerGap + optLineHeight * 0.65;
    optionLineGroups.forEach((lines) => {
      lines.forEach((line) => {
        const tspan = document.createElementNS(SVG_NS, 'tspan');
        tspan.setAttribute('x', x.toFixed(2));
        tspan.setAttribute('y', optY.toFixed(2));
        tspan.textContent = line;
        optText.appendChild(tspan);
        optY += optLineHeight;
      });
    });
    g.appendChild(optText);

    svg.appendChild(g);

    p.options.forEach((option, i) => {
      this._drawExitLabel(svg, exitAnchors.get(option.dir), LETTERS[i]);
    });
  }

  /**
   * 問題ボックスの枠線を描く。
   *
   * 以前は「入口・正解・誤答2つ」という起点セルから見た4方向だけを
   * 想定して隙間を開けていたが、ボックスは実際には1マスよりずっと
   * 大きく描かれるため、正解や誤答のルートがボックスの見た目の範囲内で
   * 何マスか続いてから外に出ることがあり、その場合は「本当の出口位置」と
   * 4方向の想定がズレて、壁のはずが実は通れたり、通れるはずが壁で
   * ふさがれて見えたりする不安定な迷路になってしまっていた。
   *
   * そこでこの実装では、ボックスの見た目の範囲に実際に入っているマス目を
   * 周辺から走査し、その範囲の内と外をまたいで実際につながっている通路
   * （grid上の本物のリンク）をすべて見つけたうえで、その位置に隙間を開ける。
   * こうすることで、壁の切れ目と実際に通れる場所が常に一致するようになる。
   *
   * @param {import('./maze.js').MazeGrid} grid
   * @param {Cell} originCell 問題が配置されたセル
   * @param {string[]} optionDirs 正解・誤答2つの方向（起点セルから見た3方向）
   * @returns {Map<string, {x:number, y:number, nx:number, ny:number}>}
   *   optionDirsの各方向 -> 隙間の中心座標と、そこから外へ向かう単位ベクトル。
   *   ABCラベルの位置合わせ（_drawExitLabel）にそのまま使う。
   */
  _drawBoxBorder(g, x, y, boxW, boxH, grid, originCell, optionDirs) {
    const halfW = boxW / 2;
    const halfH = boxH / 2;
    const gapSize = this.cellSize * 0.5;
    const cellSize = this.cellSize;
    const { toX, toY } = this.pos;

    const nw = [x - halfW, y - halfH];
    const ne = [x + halfW, y - halfH];
    const sw = [x - halfW, y + halfH];
    const se = [x + halfW, y + halfH];

    const sides = { N: [nw, ne], S: [sw, se], E: [ne, se], W: [nw, sw] };
    // 各辺からボックスの外側へ向かう単位ベクトル
    const NORMALS = { N: [0, -1], S: [0, 1], E: [1, 0], W: [-1, 0] };
    // 六角形の6方向は、見た目上近い長方形の辺（N/S/E/W）に割り当てる。
    // ラベル（anchors）の方向キーの手がかりとしてのみ使い、実際にどの辺に
    // 隙間を開けるかは下の nearestSide() で座標そのものから決める
    // （六角形の斜め方向は、方向名だけで辺を決めると実際の位置とズレて
    // しまうことがあり、それが「誤答なのに次の問題へ進めてしまう」ような
    // 不具合の原因になっていたため）。
    const HEX_TO_RECT_SIDE = { N: 'N', S: 'S', E: 'E', W: 'W', NE: 'N', NW: 'N', SE: 'S', SW: 'S' };

    /** 通過点の実際の座標から、ボックスの4辺のうちどれに一番近いかを判定する */
    const nearestSide = (px, py) => {
      const distN = Math.abs(py - (y - halfH));
      const distS = Math.abs(py - (y + halfH));
      const distE = Math.abs(px - (x + halfW));
      const distW = Math.abs(px - (x - halfW));
      const min = Math.min(distN, distS, distE, distW);
      if (min === distN) return 'N';
      if (min === distS) return 'S';
      if (min === distE) return 'E';
      return 'W';
    };

    // ボックスの見た目の範囲に実際に入っているマスを集める。
    // 注意: 見た目の範囲は数マス分の大きさがあるため、別の問題の誤答枝
    // （行き止まりを延長した通路）がたまたまこの範囲に物理的に入り込んで
    // いることがある。そのようなマスは「このボックス専用」ではないので、
    // ここでの境界判定（壁の隙間をどこに開けるか）には使わない。使って
    // しまうと、他の問題の誤答枝の通路のために本来ないはずの隙間が
    // このボックスの壁に開いてしまい、誤答から次の問題側へ紛れ込める
    // ような抜け道に見えてしまう。
    const colHalf = Math.ceil(boxW / cellSize / 2) + 1;
    const rowHalf = Math.ceil(boxH / cellSize / 2) + 1;
    const insideCells = new Set();
    for (let r = originCell.row - rowHalf; r <= originCell.row + rowHalf; r++) {
      for (let c = originCell.col - colHalf; c <= originCell.col + colHalf; c++) {
        const cell = grid.get(r, c);
        if (!cell) continue;
        if (cell.branchOwner && cell.branchOwner !== originCell) continue; // 他の問題専用の誤答枝マスは除外
        const cx = toX(r, c);
        const cy = toY(r, c);
        if (Math.abs(cx - x) < halfW && Math.abs(cy - y) < halfH) {
          insideCells.add(cell);
        }
      }
    }

    // その範囲の内と外をまたいで実際につながっている通路をすべて集める。
    const crossingsBySide = { N: [], S: [], E: [], W: [] };
    insideCells.forEach((cell) => {
      for (const [dir, other] of cell.links) {
        if (insideCells.has(other)) continue; // 内部同士のリンクは境界と無関係
        const midX = (toX(cell.row, cell.col) + toX(other.row, other.col)) / 2;
        const midY = (toY(cell.row, cell.col) + toY(other.row, other.col)) / 2;
        const side = nearestSide(midX, midY);
        if (!crossingsBySide[side]) continue;
        crossingsBySide[side].push({ cell, dir, midX, midY });
      }
    });

    const anchors = new Map();

    for (const side of Object.keys(sides)) {
      const [[x1, y1], [x2, y2]] = sides[side];
      const [nx, ny] = NORMALS[side];
      const len = (side === 'N' || side === 'S') ? Math.abs(x2 - x1) : Math.abs(y2 - y1);
      const ux = (side === 'N' || side === 'S') ? 1 : 0;
      const uy = (side === 'N' || side === 'S') ? 0 : 1;

      // 通過点を、辺の始点からの距離（0〜len）に変換して並べる。
      const crossings = crossingsBySide[side]
        .map((cr) => {
          const raw = (side === 'N' || side === 'S') ? (cr.midX - x1) : (cr.midY - y1);
          return { ...cr, t: Math.max(0, Math.min(len, raw)) };
        })
        .sort((a, b) => a.t - b.t);

      if (crossings.length === 0) {
        // この辺には実際につながる通路がないので、実線の壁として描く。
        this._line(g, x1, y1, x2, y2, 'problem-box-border');
        continue;
      }

      // 近すぎる通過点（同じ隙間に収まる距離）は1つの隙間にまとめる。
      const minSpacing = gapSize * 0.9;
      const groups = [];
      crossings.forEach((cr) => {
        const last = groups[groups.length - 1];
        if (last && cr.t - last.t < minSpacing) {
          last.members.push(cr);
          last.t = (last.t * (last.members.length - 1) + cr.t) / last.members.length;
        } else {
          groups.push({ t: cr.t, members: [cr] });
        }
      });

      let cursor = 0;
      groups.forEach((group, gi) => {
        const prevT = gi === 0 ? 0 : groups[gi - 1].t;
        const nextT = gi === groups.length - 1 ? len : groups[gi + 1].t;
        // 隣の隙間とぶつからないよう、必要なら幅を詰める。
        const half = Math.max(4, Math.min(gapSize / 2, (group.t - prevT) / 2, (nextT - group.t) / 2));
        const gapStart = Math.max(cursor, group.t - half);
        const gapEnd = Math.min(len, group.t + half);

        if (gapStart > cursor) {
          this._line(
            g,
            x1 + ux * cursor, y1 + uy * cursor,
            x1 + ux * gapStart, y1 + uy * gapStart,
            'problem-box-border'
          );
        }

        const gx = x1 + ux * group.t;
        const gy = y1 + uy * group.t;
        group.members.forEach((cr) => {
          if (cr.cell === originCell) {
            anchors.set(cr.dir, { x: gx, y: gy, nx, ny });
          }
        });

        cursor = gapEnd;
      });

      if (cursor < len) {
        this._line(g, x1 + ux * cursor, y1 + uy * cursor, x2, y2, 'problem-box-border');
      }
    }

    // 正解・誤答の3方向のうち、起点セルの直接のリンクとしては見つから
    // なかったもの（ボックスの範囲内を何マスか通ってから外に出る場合）を
    // 補う。起点セルからその方向をたどり、ボックスの外に出た地点を探す。
    (optionDirs || []).forEach((dir) => {
      if (anchors.has(dir)) return;
      let current = originCell;
      let nextDir = dir;
      for (let step = 0; step < 64; step++) {
        const next = current.links.get(nextDir);
        if (!next) break;
        if (!insideCells.has(next)) {
          const gx = (toX(current.row, current.col) + toX(next.row, next.col)) / 2;
          const gy = (toY(current.row, current.col) + toY(next.row, next.col)) / 2;
          const side = nearestSide(gx, gy);
          const [nx, ny] = NORMALS[side] || [0, 0];
          anchors.set(dir, { x: gx, y: gy, nx, ny });
          break;
        }
        // 来た方向以外の唯一のリンクをたどって奥へ進む。
        let foundDir = null;
        for (const [d, linked] of next.links) {
          if (linked === current) continue;
          foundDir = d;
          break;
        }
        if (!foundDir) break;
        current = next;
        nextDir = foundDir;
      }
    });

    // ごくまれに、誤答枝がボックスの見た目の範囲内で行き止まりになって
    // しまい（枝がボックスより短い場合）、外へ出る地点自体が存在しない
    // ことがある。この場合だけは、ボックスのその方向の辺の中央を
    // フォールバックのアンカーとして使う（ラベルを描かないよりはよい）。
    (optionDirs || []).forEach((dir) => {
      if (anchors.has(dir)) return;
      const side = HEX_TO_RECT_SIDE[dir] || dir;
      const [[sx1, sy1], [sx2, sy2]] = sides[side] || [[x, y], [x, y]];
      const [nx, ny] = NORMALS[side] || [0, 0];
      anchors.set(dir, { x: (sx1 + sx2) / 2, y: (sy1 + sy2) / 2, nx, ny });
    });

    return anchors;
  }

  /**
   * 問題ボックスの各出口方向に、A/B/Cの記号だけを配置する。
   * 選択肢の本文は問題ボックスの中に一覧表示されるため、迷路側の
   * 出口には行き先を示す記号（A/B/C）だけを小さく置けばよい。
   * 位置は _drawBoxBorder が返した「実際に開けた隙間」の座標を
   * そのまま使うため、壁の隙間とラベルが必ず一致する。
   */
  _drawExitLabel(svg, anchor, letter) {
    if (!anchor) return; // 通路の確保に失敗した場合の保険（通常は発生しない）
    const { x: gapX, y: gapY, nx, ny } = anchor;

    // ラベル本体の半径。文字をくっきり読みやすくする。
    const r = this.cellSize * 0.32;
    // ボックスの枠線（隙間）からラベルまでの隙間。ラベルを常にボックスの
    // すぐそばに留めることで、遠くの通路と紛らわしく重なるのを防ぐ。
    const edgeGap = this.cellSize * 0.12;
    const dist = edgeGap + r;

    const x = gapX + nx * dist;
    const y = gapY + ny * dist;

    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'exit-label-group');

    // ボックスの枠線と同じ色（青系）でつなぐ。迷路の壁は茶色なので、
    // 色の違いだけでも「これは迷路の壁ではない」と判別しやすくなる。
    this._line(g, gapX, gapY, x, y, 'exit-label-connector');

    // ラベル周辺にある通路の壁線を確実に覆い隠すための、少し大きめの下敷き円。
    const halo = document.createElementNS(SVG_NS, 'circle');
    halo.setAttribute('cx', x.toFixed(2));
    halo.setAttribute('cy', y.toFixed(2));
    halo.setAttribute('r', (r + 4).toFixed(2));
    halo.setAttribute('class', 'exit-label-halo');
    g.appendChild(halo);

    const bg = document.createElementNS(SVG_NS, 'circle');
    bg.setAttribute('cx', x.toFixed(2));
    bg.setAttribute('cy', y.toFixed(2));
    bg.setAttribute('r', r.toFixed(2));
    bg.setAttribute('class', 'exit-label-bg');
    g.appendChild(bg);

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', x.toFixed(2));
    text.setAttribute('y', (y + this.cellSize * 0.09).toFixed(2));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'exit-label-text');
    text.textContent = letter;
    g.appendChild(text);

    svg.appendChild(g);
  }
}

  // ---- 公開API ----
  MK.MazeRenderer = MazeRenderer;
})(window.MK);
</script>
<script>
/**
 * editor.js
 * ---------------------------------------------------------------------------
 * 編集画面のUIを管理するクラス。
 * 問題（問題文・正解・誤答1・誤答2・モンスター画像）の追加・削除、
 * 難易度の選択、迷路作成ボタン、JSON保存・読込ボタンを扱う。
 * ---------------------------------------------------------------------------
 */
window.MK = window.MK || {};

(function (MK) {
  'use strict';

  const SaveManager = MK.SaveManager;

/** HTMLエスケープ（ユーザー入力をinnerHTMLに安全に反映するため） */
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

class Editor {
  /**
   * @param {Object} callbacks
   * @param {(state:{problems:Array, difficulty:string})=>void} callbacks.onGenerate
   * @param {()=>void} [callbacks.onLoaded] JSON読込が完了し編集画面に戻すべき時に呼ばれる
   */
  constructor({ onGenerate, onLoaded }) {
    this.problems = [];
    this.nextId = 1;
    this.onGenerate = onGenerate;
    this.onLoaded = onLoaded || null;
    // 行き止まりに表示するオリジナル画像（データURL）。未設定なら既定の
    // モンスターイラストを使う。
    this.monsterImageDataUrl = null;

    this._cacheDom();
    this._bindEvents();
    // 長文問題編は4問がおすすめなので、最初からサンプル4問を入れておく
    const SAMPLE_PROBLEMS = [
      {
        question: 'たかしくんは1本120円のジュースを3本と、1個80円のパンを2個買いました。\n合計金額はいくらですか。',
        correct: '520円', wrong1: '500円', wrong2: '540円',
      },
      {
        question: '森の中で、うさぎとかめが競走をすることになりました。うさぎは足が速いので、\nとちゅうで「ちょっと休もう」と昼寝をしてしまいました。かめはゆっくりでも\n休まず歩き続け、うさぎが目をさましたときには、かめはすでにゴールしていました。\nこの話から分かることとして、最も正しいものはどれですか。',
        correct: 'こつこつ続けることが大きな力になる', wrong1: '足の速さが何よりも大事である', wrong2: '競走は必ず速い者が勝つ',
      },
      {
        question: 'たかし君のクラスでは遠足のおやつ代について話し合いました。\n先生は「一人300円までにしましょう」と言いました。\nゆみさんは120円のチョコレートと150円のグミを買おうとしています。\nゆみさんが使うお金は、先生が決めた金額とくらべてどうなりますか。',
        correct: '300円より少ない', wrong1: '300円をこえてしまう', wrong2: 'ちょうど300円になる',
      },
      {
        question: '図書館で、けんたさんは3さつの本を借りました。1さつは2週間、\nのこり2さつは1週間で返さなければなりません。\nけんたさんが最初に返すのは何さつでしょうか。',
        correct: '2さつ', wrong1: '1さつ', wrong2: '3さつ',
      },
      {
        question: 'さくらさんは毎朝6時に起きて、7時に朝ごはんを食べ、\n7時30分に家を出ます。学校までは20分かかります。\nさくらさんが学校に着くのは何時何分でしょうか。',
        correct: '7時50分', wrong1: '8時00分', wrong2: '7時40分',
      },
      {
        question: 'えんぴつが1本80円で売っています。\nゆうたさんは500円玉を1まい持って、えんぴつを5本買いました。\nおつりはいくらでしょうか。',
        correct: '100円', wrong1: '80円', wrong2: '120円',
      },
    ];
    SAMPLE_PROBLEMS.forEach((p) => this._addProblemRow(p));
  }

  _cacheDom() {
    this.tableBody = document.getElementById('problem-list');
    this.difficultySelect = document.getElementById('difficulty-select');
    this.shapeSelect = document.getElementById('maze-shape-select');
    this.fontScaleSelect = document.getElementById('font-scale-select');
    this.monsterImageInput = document.getElementById('monster-image-input');
    this.monsterImageClearBtn = document.getElementById('monster-image-clear-btn');
    this.monsterImagePreview = document.getElementById('monster-image-preview');
    this.titleInput = document.getElementById('title-input');
    this.themeInput = document.getElementById('theme-input');
    this.addBtn = document.getElementById('add-problem-btn');
    this.generateBtn = document.getElementById('generate-btn');
    this.saveBtn = document.getElementById('save-json-btn');
    this.loadInput = document.getElementById('load-json-input');
    this.emptyNotice = document.getElementById('empty-notice');
  }

  _bindEvents() {
    this.addBtn.addEventListener('click', () => this._addProblemRow());
    this.generateBtn.addEventListener('click', () => this._handleGenerate());
    this.saveBtn.addEventListener('click', () => this._handleSave());
    this.loadInput.addEventListener('change', (e) => this._handleLoad(e));

    if (this.monsterImageInput) {
      this.monsterImageInput.addEventListener('change', (e) => this._handleMonsterImageChange(e));
    }
    if (this.monsterImageClearBtn) {
      this.monsterImageClearBtn.addEventListener('click', () => {
        this.monsterImageDataUrl = null;
        if (this.monsterImageInput) this.monsterImageInput.value = '';
        this._updateMonsterPreview();
      });
    }
  }

  /** 「いきどまりの画像」ファイル選択が変更されたときの処理 */
  _handleMonsterImageChange(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      this.monsterImageDataUrl = reader.result;
      this._updateMonsterPreview();
    };
    reader.onerror = () => {
      alert('画像の読み込みに失敗しました。');
    };
    reader.readAsDataURL(file);
  }

  /** 選んだ画像のミニプレビューを表示・非表示する */
  _updateMonsterPreview() {
    if (!this.monsterImagePreview) return;
    if (this.monsterImageDataUrl) {
      this.monsterImagePreview.src = this.monsterImageDataUrl;
      this.monsterImagePreview.style.display = 'inline-block';
    } else {
      this.monsterImagePreview.style.display = 'none';
      this.monsterImagePreview.removeAttribute('src');
    }
  }

  /**
   * 問題行をテーブルに追加する。
   * @param {Object|null} data 既存データ（JSON読込時など）。nullなら空行。
   */
  _addProblemRow(data = null) {
    const id = this.nextId++;
    const problem = data
      ? { ...data, id }
      : { id, question: '', correct: '', wrong1: '', wrong2: '' };
    this.problems.push(problem);

    const tr = document.createElement('tr');
    tr.dataset.id = String(id);
    tr.innerHTML = `
      <td><textarea class="q-input" rows="4" placeholder="例: たかしくんは1本120円のジュースを3本と…（長文OK・改行も使えます）">${escapeHtml(problem.question)}</textarea></td>
      <td><textarea class="c-input" rows="2" placeholder="例: 520円">${escapeHtml(problem.correct)}</textarea></td>
      <td><textarea class="w1-input" rows="2" placeholder="例: 500円">${escapeHtml(problem.wrong1)}</textarea></td>
      <td><textarea class="w2-input" rows="2" placeholder="例: 540円">${escapeHtml(problem.wrong2)}</textarea></td>
      <td><button class="remove-btn" type="button">削除</button></td>
    `;
    this.tableBody.appendChild(tr);

    tr.querySelector('.q-input').addEventListener('input', (e) => {
      problem.question = e.target.value;
    });
    tr.querySelector('.c-input').addEventListener('input', (e) => {
      problem.correct = e.target.value;
    });
    tr.querySelector('.w1-input').addEventListener('input', (e) => {
      problem.wrong1 = e.target.value;
    });
    tr.querySelector('.w2-input').addEventListener('input', (e) => {
      problem.wrong2 = e.target.value;
    });

    tr.querySelector('.remove-btn').addEventListener('click', () => {
      this.problems = this.problems.filter((p) => p.id !== id);
      tr.remove();
      this._updateEmptyNotice();
    });

    this._updateEmptyNotice();
  }

  _updateEmptyNotice() {
    if (!this.emptyNotice) return;
    this.emptyNotice.style.display = this.problems.length === 0 ? '' : 'none';
  }

  _handleGenerate() {
    const valid = this.problems.filter(
      (p) => p.question.trim() && p.correct.trim() && p.wrong1.trim() && p.wrong2.trim()
    );
    if (valid.length === 0) {
      alert('問題・正解・誤答1・誤答2をすべて入力した問題を、少なくとも1つ用意してください。');
      return;
    }
    if (this.onGenerate) {
      this.onGenerate({
        problems: valid,
        difficulty: this.difficultySelect.value,
        shape: this.shapeSelect ? this.shapeSelect.value : 'square',
        fontScale: this.fontScaleSelect ? parseFloat(this.fontScaleSelect.value) : 1,
        monsterImage: this.monsterImageDataUrl,
        title: this.titleInput.value.trim(),
        theme: this.themeInput.value.trim(),
      });
    }
  }

  /** 迷路画面側の「文字の大きさ」変更を、編集画面のセレクトにも反映する */
  setFontScale(value) {
    if (this.fontScaleSelect) {
      this.fontScaleSelect.value = String(value);
    }
  }

  _handleSave() {
    SaveManager.exportJSON({
      problems: this.problems,
      difficulty: this.difficultySelect.value,
      shape: this.shapeSelect ? this.shapeSelect.value : 'square',
      fontScale: this.fontScaleSelect ? parseFloat(this.fontScaleSelect.value) : 1,
      monsterImage: this.monsterImageDataUrl,
      title: this.titleInput.value.trim(),
      theme: this.themeInput.value.trim(),
    });
  }

  async _handleLoad(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const data = await SaveManager.importJSON(file);
      this.loadData(data);
    } catch (err) {
      alert('JSONファイルの読み込みに失敗しました: ' + err.message);
    } finally {
      event.target.value = '';
    }
  }

  /** JSONから読み込んだデータを編集画面に反映する */
  loadData(data) {
    this.tableBody.innerHTML = '';
    this.problems = [];
    this.nextId = 1;
    const problems = Array.isArray(data.problems) ? data.problems : [];
    if (problems.length === 0) {
      this._addProblemRow();
    } else {
      problems.forEach((p) => this._addProblemRow(p));
    }
    if (data.difficulty) {
      this.difficultySelect.value = data.difficulty;
    }
    if (data.shape && this.shapeSelect) {
      this.shapeSelect.value = data.shape;
    }
    if (data.fontScale && this.fontScaleSelect) {
      this.fontScaleSelect.value = String(data.fontScale);
    }
    this.monsterImageDataUrl = data.monsterImage || null;
    if (this.monsterImageInput) this.monsterImageInput.value = '';
    this._updateMonsterPreview();
    this.titleInput.value = data.title || '';
    this.themeInput.value = data.theme || '';
    this._updateEmptyNotice();
    if (this.onLoaded) this.onLoaded();
  }

  getState() {
    return {
      problems: this.problems,
      difficulty: this.difficultySelect.value,
      shape: this.shapeSelect ? this.shapeSelect.value : 'square',
      fontScale: this.fontScaleSelect ? parseFloat(this.fontScaleSelect.value) : 1,
      monsterImage: this.monsterImageDataUrl,
      title: this.titleInput.value.trim(),
      theme: this.themeInput.value.trim(),
    };
  }
}

  // ---- 公開API ----
  MK.Editor = Editor;
})(window.MK);
</script>
<script>
/**
 * main.js
 * ---------------------------------------------------------------------------
 * アプリ全体の統合（コンポジションルート）。
 * 編集画面と教材（迷路）画面の切り替え、迷路生成の指揮、印刷ボタンの
 * 処理などを行う MazeApp クラスをここで定義し、DOMContentLoaded時に
 * 1つだけインスタンス化する。グローバル変数は一切使用しない。
 * ---------------------------------------------------------------------------
 */
window.MK = window.MK || {};

(function (MK) {
  'use strict';

  const Editor = MK.Editor;
  const MazeGrid = MK.MazeGrid;
  const planProblemPlacements = MK.planProblemPlacements;
  const computeSegments = MK.computeSegments;
  const shuffleArray = MK.shuffleArray;
  const ClusterMazeGenerator = MK.ClusterMazeGenerator;
  const MazeRenderer = MK.MazeRenderer;

/** 難易度ごとの基本的なグリッドサイズ */
const BASE_SIZE_BY_DIFFICULTY = {
  small: { rows: 11, cols: 18 },
  medium: { rows: 12, cols: 20 },
  large: { rows: 14, cols: 23 },
};

/** 迷路生成を諦めるまでの最大試行回数（毎回グリッドを少しずつ広げていく） */
// 誤答枝が付け替え前の木構造に持っていた「隠れた子孫」もすべて予約
// 済みマスとして取り込むよう修正した（誤答から次の問題やゴールへ
// 抜け道ができてしまう不具合の根本修正）。この影響で1問あたりが
// 使う予約マスが増え、後の問題ほど配置できる空きマスが見つかりにくく
// なったため、以前より少し試行回数と盤面の広がりに余裕を持たせている。
const MAX_GENERATION_ATTEMPTS = 28;
// 六角形は1マスあたりの分岐が多い分、正解＋誤答2つ分の安全な空きを確保
// できる配置が四角形より見つかりにくく、同じ盤面サイズでは問題数を
// 多く入れにくい。そのため六角形のときだけ試行回数を増やし、盤面の
// 広がり方も大きくして、10問程度までは無理なく収まるようにしている。
const MAX_GENERATION_ATTEMPTS_HEX = 32;
const GRID_GROWTH_STEP_HEX = 3; // 四角形は2ずつ広げる（下のgrowth計算を参照）
const PROBLEM_EXTRA_MULT_HEX = 2.2; // 四角形は常に1倍
// 六角形は「東西の目の詰まり方」が縦方向のセル間隔より広いため、行数・列数を
// 同じ数にすると印刷時に横長になりすぎる（A4縦に対して非効率）。
// 列数だけ少し絞ることで、全体の見た目を縦長寄りに近づけている。
const COLS_SCALE_HEX = 0.8;

/**
 * 難易度ごとのループ辺の密度（0〜1）。
 * 値が低いほど「木」に近い構造になり、正解・誤答の分岐とは無関係な
 * 意図しない行き止まり（細い枝道）が迷路のあちこちに増えてしまう
 * （実測で全体の最大18%前後のマスが、モンスターのいない行き止まりに
 * なることがあった）。値を上げてループ（別ルート）を増やすことで、
 * そうした「なぜか行き止まりになっている狭い通路」を減らしている。
 *
 * 一度0.8〜0.9まで上げてみたところ、ループ（別ルート）が増えすぎて
 * 迷路全体の通路が複雑になり、かえって「通路が不安定」に感じられる
 * 結果になったため、ほどよいバランスの値まで下げている。なお、
 * この密度は各問題の区間（segmentMap）内でしか辺を追加しないため、
 * 値を上げても正解を選ばないと先の区間へは進めない、という迷路として
 * のルールには影響しない。
 */
const LOOP_DENSITY_BY_DIFFICULTY = {
  small: 0.55,
  medium: 0.6,
  large: 0.65,
};

/**
 * アプリケーション全体を管理するクラス。
 */
class MazeApp {
  constructor() {
    this.editorScreen = document.getElementById('editor-screen');
    this.mazeScreen = document.getElementById('maze-screen');
    this.mazeContainer = document.getElementById('maze-container');

    this.renderer = new MazeRenderer(this.mazeContainer);

    this.editor = new Editor({
      onGenerate: (state) => this._handleGenerate(state),
      onLoaded: () => this.showEditor(),
    });

    this._bindScreenControls();
  }

  _bindScreenControls() {
    document.getElementById('back-to-edit-btn').addEventListener('click', () => this.showEditor());
    document.getElementById('print-btn').addEventListener('click', () => this.print());
    document.getElementById('save-pdf-btn').addEventListener('click', () => this.savePdf());

    this.mazeFontScaleSelect = document.getElementById('maze-font-scale-select');
    if (this.mazeFontScaleSelect) {
      this.mazeFontScaleSelect.addEventListener('change', () => this._handleFontScaleChange());
    }
  }

  /**
   * 迷路画面の「文字の大きさ」セレクトが変更されたときの処理。
   * 迷路そのもの（通路の形）は変えず、直前に生成したグリッド・配置を
   * 使って文字サイズだけを変えて再描画する。
   */
  _handleFontScaleChange() {
    if (!this._lastGrid || !this._lastLayout || !this.mazeFontScaleSelect) return;
    const fontScale = parseFloat(this.mazeFontScaleSelect.value) || 1;
    this.renderer.render(this._lastGrid, this._lastLayout, {
      ...this._lastRenderOptions,
      fontScale,
    });
    if (this.editor && this.editor.setFontScale) {
      this.editor.setFontScale(fontScale);
    }
  }

  showEditor() {
    this.mazeScreen.classList.add('hidden');
    this.editorScreen.classList.remove('hidden');
  }

  showMaze() {
    this.editorScreen.classList.add('hidden');
    this.mazeScreen.classList.remove('hidden');
  }

  /**
   * 「迷路作成」ボタンが押されたときの処理。
   */
  _handleGenerate(state) {
    const shape = state.shape === 'hex' ? 'hex' : 'square';
    MK.setMazeShape(shape);

    const base = BASE_SIZE_BY_DIFFICULTY[state.difficulty] || BASE_SIZE_BY_DIFFICULTY.medium;
    const problemCount = state.problems.length;

    const maxAttempts = shape === 'hex' ? MAX_GENERATION_ATTEMPTS_HEX : MAX_GENERATION_ATTEMPTS;
    const growthStep = shape === 'hex' ? GRID_GROWTH_STEP_HEX : 2;
    const extraMult = shape === 'hex' ? PROBLEM_EXTRA_MULT_HEX : 1;

    let result = null;
    for (let attempt = 0; attempt < maxAttempts && !result; attempt++) {
      const growth = Math.floor(attempt / 2) * growthStep;
      const extra = Math.ceil((problemCount / 2) * extraMult);
      const rows = base.rows + extra + growth;
      const rawCols = base.cols + extra + growth;
      const cols = shape === 'hex' ? Math.max(4, Math.round(rawCols * COLS_SCALE_HEX)) : rawCols;
      result = this._tryGenerate(rows, cols, state.problems, state.difficulty);
    }

    if (!result) {
      alert(
        '迷路の生成に失敗しました。問題数を減らすか、迷路の大きさを変えてもう一度お試しください。'
      );
      return;
    }

    const renderOptions = {
      title: state.title,
      theme: state.theme,
      shape,
      fontScale: state.fontScale,
      monsterImage: state.monsterImage,
    };
    // 迷路画面側の「文字の大きさ」を後から変えても迷路を作り直さずに
    // 再描画できるよう、生成結果とレンダリング条件を保持しておく。
    this._lastGrid = result.grid;
    this._lastLayout = result.layout;
    this._lastRenderOptions = { title: state.title, theme: state.theme, shape, monsterImage: state.monsterImage };

    this.renderer.render(result.grid, result.layout, renderOptions);
    if (this.mazeFontScaleSelect) {
      this.mazeFontScaleSelect.value = String(state.fontScale || 1);
    }
    this.showMaze();
  }

  /**
   * 指定したサイズで1回、迷路の生成を試みる。
   * @returns {{grid, layout}|null} 成功時は描画に必要なデータ、失敗時は null。
   */
  _tryGenerate(rows, cols, problemDataList, difficulty) {
    const grid = new MazeGrid(rows, cols);
    const start = grid.get(0, cols - 1); // スタートは右上
    const goal = grid.get(rows - 1, 0); // ゴールは左下
    start.role = 'start';
    goal.role = 'goal';

    const generator = new ClusterMazeGenerator(grid);
    generator.generateSpanningTree();

    const plan = planProblemPlacements(grid, start, goal, problemDataList.length);
    if (!plan) return null;

    // 問題ボックスの見た目の範囲に隠れる無関係なマスを、ループ辺を追加する
    // 前にあらかじめ通行不能にしておく（詳細は maze.js の
    // excavateProblemFootprints のコメント参照）。レンダラーと同じ座標系で
    // 判定する必要があるため、迷路の形に応じた簡易な座標変換を用意する
    // （絶対位置は使わないので、レンダラー側のpad等のオフセットは省略できる）。
    const cellSize = MK.DEFAULT_CELL_SIZE;
    let cellPos;
    if (MK.mazeShape === 'hex') {
      const hexR = cellSize * 0.62;
      const colStep = hexR * Math.sqrt(3);
      const rowStep = hexR * 1.5;
      cellPos = {
        toX: (row, col) => colStep * col + (row % 2 === 1 ? colStep / 2 : 0),
        toY: (row) => rowStep * row,
      };
    } else {
      cellPos = {
        toX: (row, col) => col * cellSize,
        toY: (row) => row * cellSize,
      };
    }
    const protectedCells = MK.excavateProblemFootprints(
      grid, plan, problemDataList, cellSize, cellPos.toX, cellPos.toY
    );

    const problemsLayout = [];
    const deadEndsLayout = [];

    plan.placements.forEach((placement, i) => {
      const data = problemDataList[i];
      const optionEntries = [
        { text: data.correct, isCorrect: true, dir: placement.correctDir },
        { text: data.wrong1, isCorrect: false, dir: placement.branches[0].dir },
        { text: data.wrong2, isCorrect: false, dir: placement.branches[1].dir },
      ];
      const shuffledOptions = shuffleArray(optionEntries);

      problemsLayout.push({
        cell: placement.cell,
        questionText: data.question,
        options: shuffledOptions,
        entranceDir: placement.incomingDir,
      });

      placement.branches.forEach((branch) => {
        deadEndsLayout.push({ cell: branch.monsterCell });
      });
    });

    const segmentMap = computeSegments(grid, start, plan.trunkPath, plan.placements);
    const loopDensity = LOOP_DENSITY_BY_DIFFICULTY[difficulty] || LOOP_DENSITY_BY_DIFFICULTY.medium;
    // 問題ボックスの範囲内（protectedCells）には新たな抜け道を作らせない。
    generator.addLoopEdges(loopDensity, segmentMap, protectedCells);

    // 最終安全確認: スタートからゴール、およびすべての問題への到達可能性
    if (!grid.bfsPath(start, goal)) return null;
    for (const p of problemsLayout) {
      if (!grid.bfsPath(start, p.cell)) return null;
    }

    // 最終安全確認その2: 問題ボックス同士が重ならないか。
    // 文字サイズは後から「特大」まで変更できるため、その最大サイズで
    // 見積もったボックス同士が重なってしまう配置は、この時点でやり直す
    // （MIN_GRID_DIST等のマス目単位の間隔だけでは、長文の問題が並んだ
    // ときの実際の見た目の大きさまでは考慮できないため）。
    const MAX_FONT_SCALE = 1.4;
    const boxFootprints = problemsLayout.map((p) => {
      const optionTexts = p.options.map((o) => o.text);
      const { boxW, boxH } = MK.estimateProblemBoxSize(cellSize, p.questionText, optionTexts, MAX_FONT_SCALE);
      return {
        cx: cellPos.toX(p.cell.row, p.cell.col),
        cy: cellPos.toY(p.cell.row, p.cell.col),
        boxW,
        boxH,
      };
    });
    for (let i = 0; i < boxFootprints.length; i++) {
      for (let j = i + 1; j < boxFootprints.length; j++) {
        const a = boxFootprints[i];
        const b = boxFootprints[j];
        const dx = Math.abs(a.cx - b.cx) - (a.boxW / 2 + b.boxW / 2);
        const dy = Math.abs(a.cy - b.cy) - (a.boxH / 2 + b.boxH / 2);
        if (dx < 0 && dy < 0) return null; // 重なる恐れがあるので、この配置はやり直す
      }
    }

    return {
      grid,
      layout: {
        start,
        goal,
        problems: problemsLayout,
        deadEnds: deadEndsLayout,
      },
    };
  }

  /** 印刷ボタンの処理（A4横1ページに収まるようCSS側で自動縮小される） */
  print() {
    window.print();
  }

  /**
   * 「PDFに保存」ボタンの処理。
   */
  savePdf() {
    alert(
      'これから印刷ダイアログが開きます。\n' +
      '「送信先」または「プリンター」の欄で「PDFに保存」（または「Microsoft Print to PDF」）を選んで保存してください。'
    );
    window.print();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new MazeApp();
});

})(window.MK);
</script>
